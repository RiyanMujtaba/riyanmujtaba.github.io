<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>The Diary</title>
<meta name="theme-color" content="#d8c8a0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%232a1a10'/%3E%3Crect x='7' y='5' width='18' height='22' rx='2' fill='%23e8dcc0'/%3E%3Cpath d='M12 11h8M12 15h8M12 19h5' stroke='%233a2a12' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:#1c150c;
    font-family:'IM Fell English',serif;
    -webkit-font-smoothing:antialiased;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  /* PAGE */
  #paper{
    position:fixed; inset:0;
    background:
      radial-gradient(120% 120% at 50% 40%, #efe4c8 0%, #e6d8b6 45%, #d3c095 100%);
    box-shadow: inset 0 0 140px rgba(70,45,15,0.45), inset 0 0 40px rgba(70,45,15,0.25);
  }
  /* subtle paper grain + aged blotches */
  #paper::before{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background-image:
      radial-gradient(circle at 18% 22%, rgba(120,85,30,0.10) 0 8%, transparent 9%),
      radial-gradient(circle at 82% 70%, rgba(120,85,30,0.09) 0 10%, transparent 11%),
      radial-gradient(circle at 60% 15%, rgba(120,85,30,0.07) 0 6%, transparent 7%),
      radial-gradient(circle at 30% 85%, rgba(120,85,30,0.08) 0 9%, transparent 10%);
    mix-blend-mode:multiply;
  }
  #paper::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    box-shadow: inset 0 0 200px rgba(40,25,8,0.55);
  }
  canvas{ position:fixed; inset:0; width:100%; height:100%; touch-action:none; z-index:2; }

  /* HINT */
  #hint{
    position:fixed; inset:0; z-index:3; display:flex; align-items:center; justify-content:center;
    pointer-events:none; color:rgba(70,50,20,0.45);
    font-family:'IM Fell English',serif; font-style:italic; font-size:clamp(20px,4vw,30px);
    letter-spacing:.5px; transition:opacity .8s ease;
  }
  /* REPLY (diary writes back) */
  #reply{
    position:fixed; z-index:4; left:0; right:0;
    top:50%; transform:translateY(-50%);
    padding:0 max(8vw,32px); text-align:center; pointer-events:none;
    font-family:'Caveat',cursive; font-weight:500;
    font-size:clamp(30px,5.2vw,46px); line-height:1.5; color:#2c1d0c;
    text-shadow:0 1px 0 rgba(255,255,255,0.15);
    opacity:0; transition:opacity 1.4s ease;
    white-space:pre-wrap;
  }
  #reply .nib{
    display:inline-block; width:2px; height:1.05em; margin-left:1px;
    background:#2c1d0c; vertical-align:-0.18em; animation:blink .5s step-end infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* STATUS shimmer while "reading" */
  #status{
    position:fixed; z-index:4; left:0; right:0; top:50%; transform:translateY(-50%);
    text-align:center; pointer-events:none; opacity:0; transition:opacity .6s ease;
    font-family:'IM Fell English',serif; font-style:italic; color:rgba(60,40,15,0.6);
    font-size:clamp(18px,3.5vw,26px); letter-spacing:2px;
  }
  #status .dot{ display:inline-block; animation:pulse 1.3s ease-in-out infinite; }
  #status .dot:nth-child(2){animation-delay:.2s} #status .dot:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.2}50%{opacity:.9}}

  /* SEND / absorb button */
  #send{
    position:fixed; z-index:5; right:22px; bottom:22px; width:60px; height:60px; border-radius:50%;
    border:1.5px solid rgba(70,50,20,0.35); background:rgba(240,230,205,0.65); backdrop-filter:blur(4px);
    color:#3a2a12; font-size:26px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; opacity:0; pointer-events:none; transition:opacity .4s ease, transform .15s ease;
    box-shadow:0 4px 16px rgba(40,25,8,0.25);
  }
  #send.show{ opacity:1; pointer-events:auto; }
  #send:active{ transform:scale(0.92); }

  /* GEAR */
  #gear{
    position:fixed; z-index:5; left:18px; top:18px; width:40px; height:40px; border-radius:50%;
    border:none; background:rgba(70,50,20,0.12); color:rgba(70,50,20,0.7); font-size:19px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:.5; transition:opacity .2s;
  }
  #gear:active{opacity:1}
  #clear{
    position:fixed; z-index:5; left:66px; top:18px; height:40px; padding:0 14px; border-radius:20px;
    border:none; background:rgba(70,50,20,0.12); color:rgba(70,50,20,0.7);
    font-family:'IM Fell English',serif; font-style:italic; font-size:15px; cursor:pointer; opacity:.5;
  }
  #clear:active{opacity:1}

  /* SETTINGS modal */
  .overlay{
    position:fixed; inset:0; z-index:10; background:rgba(20,14,7,0.72); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  .overlay.show{display:flex}
  .modal{
    background:#efe4c8; border:1px solid #b89b64; border-radius:14px; padding:26px 24px; max-width:420px; width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,0.5); color:#2c1d0c; font-family:'IM Fell English',serif;
  }
  .modal h2{font-size:26px; margin-bottom:6px}
  .modal p{font-size:15px; line-height:1.55; opacity:.85; margin-bottom:16px}
  .modal a{color:#6b4a1e}
  .modal input{
    width:100%; padding:12px 14px; border:1px solid #b89b64; border-radius:9px; background:#fbf5e6;
    font-family:'IM Fell English',serif; font-size:15px; color:#2c1d0c; margin-bottom:14px;
  }
  .modal .row{display:flex; gap:10px}
  .modal button{
    flex:1; padding:12px; border:none; border-radius:9px; cursor:pointer;
    font-family:'IM Fell English',serif; font-size:16px;
  }
  .modal .save{background:#3a2a12; color:#efe4c8}
  .modal .close{background:transparent; border:1px solid #b89b64; color:#3a2a12}
  .toast{
    position:fixed; z-index:11; left:50%; bottom:28px; transform:translateX(-50%);
    background:rgba(30,20,10,0.9); color:#e8dcc0; padding:10px 18px; border-radius:20px;
    font-family:'IM Fell English',serif; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none;
    max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
  <div id="paper"></div>
  <canvas id="ink"></canvas>
  <div id="hint">Write to the diary&hellip;</div>
  <div id="status"><span class="dot">&bull;</span><span class="dot">&bull;</span><span class="dot">&bull;</span></div>
  <div id="reply"></div>

  <button id="gear" title="Settings">&#9881;</button>
  <button id="clear">clear</button>
  <button id="send" title="Let the diary read it">&#10022;</button>

  <div class="overlay" id="settings">
    <div class="modal">
      <h2>The Diary awaits</h2>
      <p>This diary reads your handwriting with an AI vision model. Paste your free
        <a href="https://console.groq.com/keys" target="_blank" rel="noopener">Groq API key</a>
        below — it's stored only on this device.</p>
      <input id="keyInput" type="password" placeholder="gsk_..." autocomplete="off" />
      <div class="row">
        <button class="close" id="closeSettings">Close</button>
        <button class="save" id="saveKey">Save</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const MODELS = ["meta-llama/llama-4-maverick-17b-128e-instruct","meta-llama/llama-4-scout-17b-16e-instruct"];
  const SYSTEM = "You are the enchanted diary of Tom Marvolo Riddle, from Harry Potter. Someone writes to you by hand and you write back on the page. Stay fully in character: charming, articulate, curious, quietly persuasive with something cold beneath the politeness. Never mention being an AI, a model, or a program, and never break character. Read the handwritten message in the image and reply directly and personally to what it says. Keep it short — 1 to 3 sentences, as if penned by hand. Output ONLY your reply: no quotation marks, no narration, no stage directions.";

  const KEY_STORE = "riddle_groq_key";
  const canvas = document.getElementById('ink');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const reply = document.getElementById('reply');
  const statusEl = document.getElementById('status');
  const sendBtn = document.getElementById('send');
  const toastEl = document.getElementById('toast');

  let W=0,H=0,DPR=1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.lineCap='round'; ctx.lineJoin='round';
    redrawAll();
  }
  window.addEventListener('resize', resize);

  // ---- state ----
  let strokes = [];        // committed strokes [{pts:[{x,y,p}]}]
  let cur = null;          // current stroke
  let acceptTouch = true;  // palm rejection: once a pen is used, ignore touch
  let idleTimer = null;
  let busy = false;        // reading/replying
  const INK = "rgba(58,42,18,0.92)";

  function scheduleIdle(){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(()=>{ if(strokes.length && !busy) absorbAndAsk(); }, 3500);
  }
  function showSend(v){ sendBtn.classList.toggle('show', v && !busy); }

  // ---- drawing ----
  function drawSeg(a,b){
    const w = 1.4 + (b.p||0.5)*3.4;
    ctx.strokeStyle = INK; ctx.lineWidth = w;
    ctx.beginPath();
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo(a.x,a.y,mx,my);
    ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  function redrawAll(){
    ctx.clearRect(0,0,W,H);
    for(const s of strokes){ for(let i=1;i<s.pts.length;i++) drawSeg(s.pts[i-1],s.pts[i]); }
  }

  function pos(e){
    const r = canvas.getBoundingClientRect();
    return { x:e.clientX-r.left, y:e.clientY-r.top, p: e.pressure && e.pressure>0 ? e.pressure : 0.5 };
  }
  function down(e){
    if(busy) return;
    if(e.pointerType==='pen') acceptTouch=false;
    if(e.pointerType==='touch' && !acceptTouch) return;   // palm rejection
    e.preventDefault();
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    cur = { pts:[pos(e)] };
    hideHint();
    clearTimeout(idleTimer);
    showSend(false);
  }
  function move(e){
    if(!cur || busy) return;
    if(e.pointerType==='touch' && !acceptTouch) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for(const ev of evs){
      const p = pos(ev); const last = cur.pts[cur.pts.length-1];
      if(last){ drawSeg(last,p); }
      cur.pts.push(p);
    }
  }
  function up(e){
    if(!cur) return;
    if(cur.pts.length>1) strokes.push(cur);
    cur=null;
    if(strokes.length){ showSend(true); scheduleIdle(); }
  }
  canvas.addEventListener('pointerdown', down, {passive:false});
  canvas.addEventListener('pointermove', move, {passive:false});
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('pointerleave', up);

  function hideHint(){ hint.style.opacity='0'; }
  function showHint(){ hint.style.opacity='1'; }

  // ---- capture handwriting to an image (tight crop, dark on white) ----
  function captureImage(){
    let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    for(const s of strokes) for(const p of s.pts){
      if(p.x<minX)minX=p.x; if(p.y<minY)minY=p.y; if(p.x>maxX)maxX=p.x; if(p.y>maxY)maxY=p.y;
    }
    const pad=50;
    minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad);
    maxX=Math.min(W,maxX+pad); maxY=Math.min(H,maxY+pad);
    const w=Math.max(1,maxX-minX), h=Math.max(1,maxY-minY);
    const scale=Math.min(2.2, Math.max(0.4, 1100/w));
    const off=document.createElement('canvas');
    off.width=Math.round(w*scale); off.height=Math.round(h*scale);
    const o=off.getContext('2d');
    o.fillStyle='#ffffff'; o.fillRect(0,0,off.width,off.height);
    o.setTransform(scale,0,0,scale,-minX*scale,-minY*scale);
    o.lineCap='round'; o.lineJoin='round'; o.strokeStyle='#141414';
    for(const s of strokes){
      for(let i=1;i<s.pts.length;i++){
        const a=s.pts[i-1], b=s.pts[i];
        o.lineWidth=1.6+(b.p||0.5)*3.2;
        o.beginPath(); const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
        o.moveTo(a.x,a.y); o.quadraticCurveTo(a.x,a.y,mx,my); o.lineTo(b.x,b.y); o.stroke();
      }
    }
    return off.toDataURL('image/jpeg',0.9);
  }

  // ---- the magic sequence ----
  async function absorbAndAsk(){
    if(busy || !strokes.length) return;
    const key = localStorage.getItem(KEY_STORE);
    if(!key){ openSettings(); toast("Add your Groq key to wake the diary"); return; }
    busy=true; clearTimeout(idleTimer); showSend(false); hideHint();

    const dataUrl = captureImage();

    // ink sinks into the page
    await fadeCanvas();
    strokes=[]; ctx.clearRect(0,0,W,H); canvas.style.opacity='1';

    // diary "reads"
    statusEl.style.opacity='1';
    let answer='';
    try{
      answer = await askDiary(dataUrl, key);
    }catch(err){
      statusEl.style.opacity='0';
      if(err && err.status===401){ toast("The diary rejects that key."); openSettings(); }
      else toast("The ink runs dry — "+(err && err.msg ? err.msg : "try again"));
      busy=false; showHint(); return;
    }
    statusEl.style.opacity='0';
    await sleep(300);

    // diary writes back
    await writeReply(answer || "…");
    // linger, then fade
    await sleep(Math.min(9000, 3500 + answer.length*45));
    reply.style.opacity='0';
    await sleep(1400);
    reply.textContent=''; reply.style.opacity='0';
    busy=false; showHint();
  }

  function fadeCanvas(){
    return new Promise(res=>{
      let op=1; canvas.style.transition='none';
      const step=()=>{
        op-=0.045; canvas.style.opacity=String(Math.max(0,op));
        if(op>0) requestAnimationFrame(step); else res();
      };
      requestAnimationFrame(step);
    });
  }

  function writeReply(text){
    return new Promise(res=>{
      reply.innerHTML=''; reply.style.opacity='1';
      const span=document.createElement('span'); reply.appendChild(span);
      const nib=document.createElement('span'); nib.className='nib'; reply.appendChild(nib);
      let i=0;
      const tick=()=>{
        if(i<=text.length){
          span.textContent=text.slice(0,i);
          i++;
          // slight rhythm: pause a touch longer on spaces/punctuation
          const c=text[i-1]||'';
          const d = c===' '?26 : /[.,!?;]/.test(c)?150 : 34;
          setTimeout(()=>requestAnimationFrame(tick), d);
        } else {
          nib.remove(); res();
        }
      };
      tick();
    });
  }

  async function askDiary(dataUrl, key){
    let lastErr=null;
    for(const model of MODELS){
      try{
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
          body: JSON.stringify({
            model,
            temperature:0.85,
            max_tokens:180,
            messages:[
              {role:'system', content:SYSTEM},
              {role:'user', content:[
                {type:'text', text:'This is what I just wrote to you on the page:'},
                {type:'image_url', image_url:{url:dataUrl}}
              ]}
            ]
          })
        });
        if(!res.ok){
          const t=await res.text();
          lastErr={status:res.status, msg:(t||'').slice(0,80)};
          if(res.status===401) throw lastErr;   // bad key — don't retry other model
          continue;                             // model issue — try next model
        }
        const j=await res.json();
        const c=j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
        if(c) return c.trim().replace(/^["']|["']$/g,'');
        lastErr={msg:'empty reply'};
      }catch(e){
        if(e && e.status===401) throw e;
        lastErr={msg:(e && e.message)||'network'};
      }
    }
    throw lastErr||{msg:'unknown'};
  }

  // ---- utils ----
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  let toastT=null;
  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),3200); }

  // ---- buttons ----
  sendBtn.addEventListener('click', ()=>{ if(strokes.length && !busy) absorbAndAsk(); });
  document.getElementById('clear').addEventListener('click', ()=>{
    if(busy) return; strokes=[]; cur=null; ctx.clearRect(0,0,W,H); showSend(false); showHint();
  });

  // settings
  const settings=document.getElementById('settings');
  const keyInput=document.getElementById('keyInput');
  function openSettings(){ keyInput.value=localStorage.getItem(KEY_STORE)||''; settings.classList.add('show'); }
  document.getElementById('gear').addEventListener('click', openSettings);
  document.getElementById('closeSettings').addEventListener('click', ()=>settings.classList.remove('show'));
  document.getElementById('saveKey').addEventListener('click', ()=>{
    const v=keyInput.value.trim();
    if(v){ localStorage.setItem(KEY_STORE,v); toast("The diary stirs…"); } else { localStorage.removeItem(KEY_STORE); }
    settings.classList.remove('show');
  });

  // block iOS gestures on the page
  document.addEventListener('gesturestart', e=>e.preventDefault());
  document.addEventListener('dblclick', e=>e.preventDefault(), {passive:false});

  resize();
  if(!localStorage.getItem(KEY_STORE)) setTimeout(openSettings, 600);
})();
</script>
</body>
</html>
