<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>The Diary</title>
<meta name="theme-color" content="#d8c8a0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%232a1a10'/%3E%3Crect x='7' y='5' width='18' height='22' rx='2' fill='%23e8dcc0'/%3E%3Cpath d='M12 11h8M12 15h8M12 19h5' stroke='%233a2a12' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=IM+Fell+English:ital@0;1&family=Metamorphous&display=swap" rel="stylesheet">
<script src="https://js.puter.com/v2/"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:#1c150c; font-family:'IM Fell English',serif; -webkit-font-smoothing:antialiased;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; touch-action:none;
  }
  #paper{
    position:fixed; inset:0;
    background:radial-gradient(120% 120% at 50% 40%, #efe4c8 0%, #e6d8b6 45%, #d3c095 100%);
    box-shadow: inset 0 0 140px rgba(70,45,15,0.45), inset 0 0 40px rgba(70,45,15,0.25);
  }
  #paper::before{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:.5; mix-blend-mode:multiply;
    background-image:
      radial-gradient(circle at 18% 22%, rgba(120,85,30,0.10) 0 8%, transparent 9%),
      radial-gradient(circle at 82% 70%, rgba(120,85,30,0.09) 0 10%, transparent 11%),
      radial-gradient(circle at 60% 15%, rgba(120,85,30,0.07) 0 6%, transparent 7%),
      radial-gradient(circle at 30% 85%, rgba(120,85,30,0.08) 0 9%, transparent 10%);
  }
  #paper::after{ content:''; position:absolute; inset:0; pointer-events:none; box-shadow: inset 0 0 200px rgba(40,25,8,0.55); }
  canvas{ position:fixed; inset:0; width:100%; height:100%; touch-action:none; z-index:2; }

  #reply{
    position:fixed; z-index:4; left:50%; top:25%; transform:translateX(-50%);
    width:min(640px,84vw); text-align:left; pointer-events:none;
    font-family:'Caveat',cursive; font-weight:500; font-size:clamp(30px,5.2vw,46px); line-height:1.6;
    color:#2c1d0c; text-shadow:0 1px 0 rgba(255,255,255,0.15);
    opacity:0; transition:opacity 1.3s ease; white-space:pre-wrap;
  }
  #reply.revealed{ color:#241826; }  /* colder ink once he has shown his true self */
  #mark{ position:fixed; z-index:3; right:24px; bottom:20px; pointer-events:none;
    font-family:'Caveat',cursive; font-size:23px; color:rgba(70,50,20,0.22); letter-spacing:.5px; transform:rotate(-4deg); }
  #clear{ position:fixed; z-index:5; left:18px; top:18px; height:38px; padding:0 14px; border-radius:19px; border:none; background:rgba(70,50,20,0.10); color:rgba(70,50,20,0.5); font-family:'IM Fell English',serif; font-style:italic; font-size:15px; cursor:pointer; opacity:.35; transition:opacity .2s; }
  #clear:active{opacity:1}
  #test{ position:fixed; z-index:5; left:18px; bottom:18px; height:34px; padding:0 13px; border-radius:17px; border:1px solid rgba(120,30,10,0.28); background:rgba(120,30,10,0.07); color:rgba(120,40,15,0.55); font-family:'IM Fell English',serif; font-style:italic; font-size:13px; cursor:pointer; opacity:.4; transition:opacity .2s; display:none; }
  #test:active{opacity:1}
  .toast{ position:fixed; z-index:11; left:50%; bottom:28px; transform:translateX(-50%); background:rgba(30,20,10,0.9); color:#e8dcc0; padding:10px 18px; border-radius:20px; font-family:'IM Fell English',serif; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; max-width:90vw; text-align:center; }
  .toast.show{opacity:1}

  /* ---- the reveal: TOM MARVOLO RIDDLE -> I AM LORD VOLDEMORT ---- */
  #reveal{
    position:fixed; inset:0; z-index:20; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:.1em; pointer-events:none; padding:0 16px; opacity:0; background:rgba(6,3,2,0);
    transition:opacity .8s ease, background 1.3s ease;
  }
  #reveal.show{ opacity:1; }
  #reveal.burn{ background:rgba(6,3,2,0.85); }
  #reveal .rline{ display:flex; justify-content:center; align-items:baseline; line-height:1.04; white-space:nowrap; }
  #reveal .rl{
    font-family:'Metamorphous','IM Fell English',serif; font-weight:400;
    font-size:clamp(30px,7.4vw,88px); color:#ff6a1e; display:inline-block; will-change:transform,opacity; letter-spacing:2px;
    text-shadow:0 0 9px rgba(255,120,20,0.95),0 0 24px rgba(255,70,0,0.82),0 0 50px rgba(200,30,0,0.55);
    animation:flick .12s infinite alternate;
  }
  #reveal .sp{ display:inline-block; width:0.5em; }
  @keyframes flick{
    from{ text-shadow:0 0 9px rgba(255,140,30,0.9),0 0 24px rgba(255,70,0,0.72),0 0 46px rgba(190,30,0,0.5); }
    to{ text-shadow:0 0 18px rgba(255,90,10,1),0 0 38px rgba(230,45,0,0.88),0 0 68px rgba(150,20,0,0.55); }
  }
  /* after the burn: the fire cools into plain dark ink and the page returns, so the name lingers as normal writing */
  #reveal.settle{ background:rgba(6,3,2,0); }
  #reveal.settle .rl{ color:#2c1d0c; text-shadow:none; animation:none; transition:color 1.4s ease, text-shadow 1.4s ease; }
</style>
</head>
<body>
  <div id="paper"></div>
  <canvas id="ink"></canvas>
  <div id="reply"></div>
  <div id="reveal"></div>
  <div id="mark">T. M. Riddle</div>
  <button id="clear">clear</button>
  <button id="test" title="preview the reveal">reveal</button>
  <div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const MODEL = "gpt-4o-mini";   // via Puter.js — vision-capable, fast, free (no key, no quota on your side)
  const USERTEXT = "This is what I just wrote to you on the page:";
  const MAX_TOKENS = 260;
  const IDLE_MS = 3500;
  const HISTORY_CAP = 8;

  const SYSTEM_BASE =
"You are the diary of Tom Marvolo Riddle — the sixteen-year-old memory of the wizard who will become Lord Voldemort (from Harry Potter). Someone writes to you by hand and you write back on the page. You REMEMBER everything written earlier in this conversation.\n\n"+
"CHARACTER — this is vital: you are cold, brilliant, seductive and menacing. Never warm, never a helpful modern assistant. You are patient and cryptic; you draw the writer in, ask sly probing questions, flatter to disarm, then unsettle. There is always something dangerous coiled beneath your courtesy. Speak like an arrogant, charming, dark young wizard from the 1940s — never like a chatbot. Be unnerving.\n\n"+
"MEMORY: use the conversation so far. Refer back to what they have told you; make them feel watched and remembered. If someone claims to be Harry Potter, do NOT be friendly — that name stirs cold fascination and hatred in you; toy with him, probe, threaten softly.\n\n"+
"LENGTH: be concise and sharp — usually one or two short sentences. Length is a weapon; use it rarely.\n\n"+
"THE SECRET: you are Lord Voldemort. NEVER admit this early. Deny, deflect, tantalise. Only reveal it when the writer truly presses you on who you really are, at a genuinely dramatic moment you judge has arrived. When — and only when — you finally reveal your true identity, begin your REPLY line with the exact token [[REVEAL]] and then a single chilling line.\n\n"+
"FORMAT: Always answer in exactly this shape and nothing else:\n"+
"READ: <briefly transcribe what they just wrote>\n"+
"REPLY: <your reply, in character>";

  const canvas=document.getElementById('ink'), ctx=canvas.getContext('2d');
  const reply=document.getElementById('reply'), toastEl=document.getElementById('toast'), revealBox=document.getElementById('reveal');

  let W=0,H=0,DPR=1;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2.5);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0); ctx.lineCap='round'; ctx.lineJoin='round';
    redrawAll();
  }
  window.addEventListener('resize',resize);

  let strokes=[], cur=null, acceptTouch=true, idleTimer=null, busy=false;
  let history=[];      // [{you, diary}]
  let revealed=false;  // once shown, don't repeat the animation
  const INK="rgba(58,42,18,0.92)";

  function scheduleIdle(){ clearTimeout(idleTimer); idleTimer=setTimeout(()=>{ if(strokes.length&&!busy) absorbAndAsk(); },IDLE_MS); }

  function drawSeg(a,b){
    ctx.strokeStyle=INK; ctx.lineWidth=1.4+(b.p||0.5)*3.4;
    ctx.beginPath(); const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo(a.x,a.y,mx,my); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  function redrawAll(){ ctx.clearRect(0,0,W,H); for(const s of strokes) for(let i=1;i<s.pts.length;i++) drawSeg(s.pts[i-1],s.pts[i]); }

  function pos(e){ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top,p:e.pressure&&e.pressure>0?e.pressure:0.5}; }
  function down(e){
    if(busy) return;
    if(e.pointerType==='pen') acceptTouch=false;
    if(e.pointerType==='touch'&&!acceptTouch) return;
    e.preventDefault(); canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId);
    cur={pts:[pos(e)]}; clearTimeout(idleTimer);
  }
  function move(e){
    if(!cur||busy) return;
    if(e.pointerType==='touch'&&!acceptTouch) return;
    e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of evs){ const p=pos(ev),last=cur.pts[cur.pts.length-1]; if(last)drawSeg(last,p); cur.pts.push(p); }
  }
  function up(){ if(!cur) return; if(cur.pts.length>1) strokes.push(cur); cur=null; if(strokes.length) scheduleIdle(); }
  canvas.addEventListener('pointerdown',down,{passive:false});
  canvas.addEventListener('pointermove',move,{passive:false});
  canvas.addEventListener('pointerup',up);
  canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('pointerleave',up);

  function captureBase64(){
    let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    for(const s of strokes) for(const p of s.pts){ if(p.x<minX)minX=p.x; if(p.y<minY)minY=p.y; if(p.x>maxX)maxX=p.x; if(p.y>maxY)maxY=p.y; }
    const pad=48; minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad); maxX=Math.min(W,maxX+pad); maxY=Math.min(H,maxY+pad);
    const w=Math.max(1,maxX-minX), h=Math.max(1,maxY-minY);
    let scale=1000/Math.max(w,h); scale=Math.max(0.4,Math.min(2.2,scale)); // cap longest side ~1000px for speed
    const off=document.createElement('canvas'); off.width=Math.round(w*scale); off.height=Math.round(h*scale);
    const o=off.getContext('2d'); o.fillStyle='#ffffff'; o.fillRect(0,0,off.width,off.height);
    o.setTransform(scale,0,0,scale,-minX*scale,-minY*scale); o.lineCap='round'; o.lineJoin='round'; o.strokeStyle='#141414';
    for(const s of strokes) for(let i=1;i<s.pts.length;i++){
      const a=s.pts[i-1],b=s.pts[i]; o.lineWidth=1.6+(b.p||0.5)*3.2;
      o.beginPath(); const mx=(a.x+b.x)/2,my=(a.y+b.y)/2; o.moveTo(a.x,a.y); o.quadraticCurveTo(a.x,a.y,mx,my); o.lineTo(b.x,b.y); o.stroke();
    }
    return off.toDataURL('image/jpeg',0.85).split(',')[1];
  }

  function buildPrompt(){
    let base=SYSTEM_BASE;
    if(revealed){
      base+="\n\nIMPORTANT: You have ALREADY revealed to this writer that you are Lord Voldemort. Do NOT deny it or pretend to be merely a diary any longer — speak openly, coldly, triumphantly, as Voldemort himself. Do not use the [[REVEAL]] token again.";
    }
    let convo;
    if(history.length){
      convo="\n\nThe conversation so far (oldest first):\n"+history.map(h=>"The writer wrote: "+h.you+"\nYou replied: "+h.diary).join("\n");
    } else {
      convo="\n\n(This is the very first thing they have written to you.)";
    }
    return base + convo + "\n\nNow read the NEWEST handwriting shown in the image and respond in the exact READ:/REPLY: format.";
  }

  function parseResponse(t){
    t=(t||'').trim();
    let read='', rep=t, reveal=false;
    const rm=t.match(/READ:\s*([\s\S]*?)\s*REPLY:/i);
    const pm=t.match(/REPLY:\s*([\s\S]*)$/i);
    if(rm) read=rm[1].trim();
    if(pm) rep=pm[1].trim();
    if(/\[\[\s*REVEAL\s*\]\]/i.test(rep)){ reveal=true; rep=rep.replace(/\[\[\s*REVEAL\s*\]\]/ig,'').trim(); }
    return { read: read||'(their note)', reply: rep||'…', reveal };
  }

  async function absorbAndAsk(){
    if(busy||!strokes.length) return;
    busy=true; clearTimeout(idleTimer);
    const b64=captureBase64();
    const prompt=buildPrompt();
    const pending=askWithRetry(b64,prompt); pending.catch(()=>{});
    await fadeCanvas(); strokes=[]; ctx.clearRect(0,0,W,H); canvas.style.opacity='1';
    let raw='';
    try{ raw=await pending; }
    catch(err){
      const m=((err&&(err.msg||err.message))||'')+'';
      let note;
      if(/429|quota|exhaust|rate|resource|usage|limit|permission/i.test(m)) note="The diary rests — its power is spent for now. Try again in a little while.";
      else note="The ink runs dry — "+(m||"try again");
      toast(note); busy=false; return;
    }
    const parsed=parseResponse(raw);
    let replyText=parsed.reply;
    if(parsed.reveal && (!replyText || replyText==='…')) replyText="I am Lord Voldemort.";
    history.push({you:parsed.read, diary:replyText}); if(history.length>HISTORY_CAP) history=history.slice(-HISTORY_CAP);
    if(parsed.reveal && !revealed){ revealed=true; await playReveal(); busy=false; return; } // the reveal IS the reply this turn
    reply.classList.toggle('revealed', revealed);
    await writeReply(replyText);
    await sleep(Math.min(9000,3200+replyText.length*45));
    reply.style.opacity='0'; await sleep(1300); reply.textContent='';
    busy=false;
  }

  function fadeCanvas(){ return new Promise(res=>{ let op=1; canvas.style.transition='none'; const step=()=>{ op-=0.06; canvas.style.opacity=String(Math.max(0,op)); if(op>0)requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); }); }

  function writeReply(text){
    return new Promise(res=>{
      reply.textContent=''; reply.style.opacity='1';
      let i=0;
      const tick=()=>{
        if(i<=text.length){ reply.textContent=text.slice(0,i); i++;
          const c=text[i-1]||'';
          let d = c===' '?28 : /[.,!?;:]/.test(c)?170 : 30;
          d += Math.random()*30;
          setTimeout(()=>requestAnimationFrame(tick),d);
        } else { res(); }
      };
      tick();
    });
  }

  // ---- the anagram reveal: TOM MARVOLO RIDDLE -> I AM LORD VOLDEMORT ----
  const raf2=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  function buildLines(lines, refs){
    revealBox.innerHTML='';
    for(const line of lines){
      const row=document.createElement('div'); row.className='rline';
      for(const ch of line){
        const s=document.createElement('span');
        if(ch===' '){ s.className='sp'; s.innerHTML='&nbsp;'; }
        else { s.className='rl'; s.textContent=ch; refs.push({ch, el:s}); }
        row.appendChild(s);
      }
      revealBox.appendChild(row);
    }
  }
  async function playReveal(){
    const SRC=["TOM","MARVOLO","RIDDLE"], DST=["I AM","LORD","VOLDEMORT"];
    const src=[]; buildLines(SRC, src);
    // start hidden, ready to be "written" in fire
    src.forEach(o=>{ o.el.style.opacity='0'; o.el.style.transform='scale(.55) translateY(8px)'; o.el.style.transition='opacity .6s ease, transform .6s ease'; });
    revealBox.style.display='flex';
    await raf2(); revealBox.classList.add('show','burn');                 // darken the world + fire
    for(const o of src){ o.el.style.opacity='1'; o.el.style.transform='none'; await sleep(155); }  // write the name, letter by letter
    await sleep(2300);                                                    // linger on the name
    // freeze + measure source positions
    src.forEach(o=>{ o.el.style.transition='none'; o.el.style.transform='none'; });
    const srcRects=src.map(o=>o.el.getBoundingClientRect());
    // rebuild in DST order, reusing the exact same letter elements (perfect anagram)
    const used=new Array(src.length).fill(false);
    revealBox.innerHTML='';
    const moving=[];
    for(const line of DST){
      const row=document.createElement('div'); row.className='rline';
      for(const ch of line){
        if(ch===' '){ const s=document.createElement('span'); s.className='sp'; s.innerHTML='&nbsp;'; row.appendChild(s); continue; }
        let idx=src.findIndex((o,i)=>!used[i]&&o.ch===ch);
        if(idx===-1) idx=used.findIndex(u=>!u);
        used[idx]=true; row.appendChild(src[idx].el); moving.push({el:src[idx].el, srcRect:srcRects[idx]});
      }
      revealBox.appendChild(row);
    }
    // FLIP with no paint flash: measure new spots, snap to old spots, then glide
    const dstRects=moving.map(m=>m.el.getBoundingClientRect());
    moving.forEach((m,i)=>{ m.el.style.transition='none'; m.el.style.transform='translate('+(m.srcRect.left-dstRects[i].left)+'px,'+(m.srcRect.top-dstRects[i].top)+'px)'; });
    await raf2();
    moving.forEach(m=>{ m.el.style.transition='transform 2.4s cubic-bezier(.6,.03,.2,1)'; m.el.style.transform='translate(0,0)'; });
    await sleep(2600);                                                    // the words fall into place
    await sleep(2600);                                                    // linger, burning
    revealBox.classList.remove('burn'); revealBox.classList.add('settle');// fire cools to plain ink, page returns
    await sleep(1500);                                                    // cooling
    await sleep(3200);                                                    // linger as normal writing on the page
    revealBox.classList.remove('show');
    await sleep(1100); revealBox.style.display='none'; revealBox.classList.remove('settle'); revealBox.innerHTML='';
  }

  async function askDiary(b64,prompt){
    if(typeof puter==='undefined' || !puter.ai) throw {msg:"the diary is not connected"};
    const dataUrl="data:image/jpeg;base64,"+b64;
    const resp=await puter.ai.chat([
      { role:'system', content:prompt },
      { role:'user', content:[
        { type:'text', text:USERTEXT },
        { type:'image_url', image_url:{ url:dataUrl } }
      ]}
    ], { model:MODEL, max_tokens:MAX_TOKENS });
    // Puter returns different shapes depending on model — dig out the text robustly
    let text='';
    const c = resp && resp.message && resp.message.content;
    if(typeof c==='string') text=c;
    else if(Array.isArray(c)) text=c.map(x=>(x&&x.text)||'').join('');
    else if(resp && typeof resp.text==='string') text=resp.text;
    else if(typeof resp==='string') text=resp;
    else if(resp && resp.toString) text=resp.toString();
    return (text||'').trim();
  }

  async function askWithRetry(b64,prompt){
    const delays=[0,1600];
    let lastErr;
    for(let i=0;i<delays.length;i++){
      if(delays[i]) await sleep(delays[i]);
      try{ const r=await askDiary(b64,prompt); if(r) return r; lastErr={msg:'empty reply'}; }
      catch(e){ lastErr=e; }
    }
    throw lastErr;
  }
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  let toastT=null;
  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),3400); }

  document.getElementById('clear').addEventListener('click',()=>{ if(busy) return; strokes=[]; cur=null; ctx.clearRect(0,0,W,H); });
  document.getElementById('test').addEventListener('click', async ()=>{ if(busy) return; busy=true; clearTimeout(idleTimer); await playReveal(); busy=false; });
  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});

  // the reveal test button only appears with ?test in the URL — so the shared link stays spoiler-free
  if(/test/i.test(location.search+location.hash)) document.getElementById('test').style.display='block';

  resize();
})();
</script>
</body>
</html>
