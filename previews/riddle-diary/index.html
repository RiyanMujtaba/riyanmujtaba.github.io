<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>The Diary</title>
<meta name="theme-color" content="#d8c8a0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%232a1a10'/%3E%3Crect x='7' y='5' width='18' height='22' rx='2' fill='%23e8dcc0'/%3E%3Cpath d='M12 11h8M12 15h8M12 19h5' stroke='%233a2a12' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:#1c150c; font-family:'IM Fell English',serif; -webkit-font-smoothing:antialiased;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; touch-action:none;
  }
  #paper{
    position:fixed; inset:0;
    background:radial-gradient(120% 120% at 50% 40%, #efe4c8 0%, #e6d8b6 45%, #d3c095 100%);
    box-shadow: inset 0 0 140px rgba(70,45,15,0.45), inset 0 0 40px rgba(70,45,15,0.25);
  }
  #paper::before{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:.5; mix-blend-mode:multiply;
    background-image:
      radial-gradient(circle at 18% 22%, rgba(120,85,30,0.10) 0 8%, transparent 9%),
      radial-gradient(circle at 82% 70%, rgba(120,85,30,0.09) 0 10%, transparent 11%),
      radial-gradient(circle at 60% 15%, rgba(120,85,30,0.07) 0 6%, transparent 7%),
      radial-gradient(circle at 30% 85%, rgba(120,85,30,0.08) 0 9%, transparent 10%);
  }
  #paper::after{ content:''; position:absolute; inset:0; pointer-events:none; box-shadow: inset 0 0 200px rgba(40,25,8,0.55); }
  canvas{ position:fixed; inset:0; width:100%; height:100%; touch-action:none; z-index:2; }

  /* Reply flows DOWN from a fixed anchor — no re-centering jump */
  /* a centered column, but text left-aligned so it reads like a hand writing across the page */
  #reply{
    position:fixed; z-index:4; left:50%; top:25%; transform:translateX(-50%);
    width:min(640px,84vw); text-align:left; pointer-events:none;
    font-family:'Caveat',cursive; font-weight:500; font-size:clamp(30px,5.2vw,46px); line-height:1.6;
    color:#2c1d0c; text-shadow:0 1px 0 rgba(255,255,255,0.15);
    opacity:0; transition:opacity 1.3s ease; white-space:pre-wrap;
  }

  /* faint signature in the corner — the only marking on the page */
  #mark{ position:fixed; z-index:3; right:24px; bottom:20px; pointer-events:none;
    font-family:'Caveat',cursive; font-size:23px; color:rgba(70,50,20,0.22);
    letter-spacing:.5px; transform:rotate(-4deg); }

  #clear{ position:fixed; z-index:5; left:18px; top:18px; height:38px; padding:0 14px; border-radius:19px; border:none; background:rgba(70,50,20,0.10); color:rgba(70,50,20,0.5); font-family:'IM Fell English',serif; font-style:italic; font-size:15px; cursor:pointer; opacity:.35; transition:opacity .2s; }
  #clear:active{opacity:1}
  .toast{ position:fixed; z-index:11; left:50%; bottom:28px; transform:translateX(-50%); background:rgba(30,20,10,0.9); color:#e8dcc0; padding:10px 18px; border-radius:20px; font-family:'IM Fell English',serif; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; max-width:90vw; text-align:center; }
  .toast.show{opacity:1}
</style>
</head>
<body>
  <div id="paper"></div>
  <canvas id="ink"></canvas>
  <div id="reply"></div>
  <div id="mark">T. M. Riddle</div>
  <button id="clear">clear</button>
  <div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const WORKER_URL = "https://tomriddlediary.mujtabariyan91.workers.dev";
  const SYSTEM = "You are the enchanted diary of Tom Marvolo Riddle (Harry Potter). Someone writes to you by hand; you write back on the page. Voice: mysterious, composed, quietly charming with something cold beneath. Be CONCISE — usually a single short sentence. Only write more when the message truly calls for it, and never more than three sentences. Read the handwriting in the image and answer it directly. Never mention being an AI or break character. Output ONLY the reply — no quotes, no narration.";
  const MAX_TOKENS = 130;
  const IDLE_MS = 3500;

  const canvas=document.getElementById('ink'), ctx=canvas.getContext('2d');
  const reply=document.getElementById('reply'), toastEl=document.getElementById('toast');

  let W=0,H=0,DPR=1;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2.5);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0); ctx.lineCap='round'; ctx.lineJoin='round';
    redrawAll();
  }
  window.addEventListener('resize',resize);

  let strokes=[], cur=null, acceptTouch=true, idleTimer=null, busy=false;
  const INK="rgba(58,42,18,0.92)";

  function scheduleIdle(){ clearTimeout(idleTimer); idleTimer=setTimeout(()=>{ if(strokes.length&&!busy) absorbAndAsk(); },IDLE_MS); }

  function drawSeg(a,b){
    ctx.strokeStyle=INK; ctx.lineWidth=1.4+(b.p||0.5)*3.4;
    ctx.beginPath(); const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo(a.x,a.y,mx,my); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  function redrawAll(){ ctx.clearRect(0,0,W,H); for(const s of strokes) for(let i=1;i<s.pts.length;i++) drawSeg(s.pts[i-1],s.pts[i]); }

  function pos(e){ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top,p:e.pressure&&e.pressure>0?e.pressure:0.5}; }
  function down(e){
    if(busy) return;
    if(e.pointerType==='pen') acceptTouch=false;
    if(e.pointerType==='touch'&&!acceptTouch) return;
    e.preventDefault(); canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId);
    cur={pts:[pos(e)]}; clearTimeout(idleTimer);
  }
  function move(e){
    if(!cur||busy) return;
    if(e.pointerType==='touch'&&!acceptTouch) return;
    e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of evs){ const p=pos(ev),last=cur.pts[cur.pts.length-1]; if(last)drawSeg(last,p); cur.pts.push(p); }
  }
  function up(){ if(!cur) return; if(cur.pts.length>1) strokes.push(cur); cur=null; if(strokes.length) scheduleIdle(); }
  canvas.addEventListener('pointerdown',down,{passive:false});
  canvas.addEventListener('pointermove',move,{passive:false});
  canvas.addEventListener('pointerup',up);
  canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('pointerleave',up);

  function captureBase64(){
    let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    for(const s of strokes) for(const p of s.pts){ if(p.x<minX)minX=p.x; if(p.y<minY)minY=p.y; if(p.x>maxX)maxX=p.x; if(p.y>maxY)maxY=p.y; }
    const pad=50; minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad); maxX=Math.min(W,maxX+pad); maxY=Math.min(H,maxY+pad);
    const w=Math.max(1,maxX-minX), h=Math.max(1,maxY-minY);
    const scale=Math.min(2.2,Math.max(0.4,1100/w));
    const off=document.createElement('canvas'); off.width=Math.round(w*scale); off.height=Math.round(h*scale);
    const o=off.getContext('2d'); o.fillStyle='#ffffff'; o.fillRect(0,0,off.width,off.height);
    o.setTransform(scale,0,0,scale,-minX*scale,-minY*scale); o.lineCap='round'; o.lineJoin='round'; o.strokeStyle='#141414';
    for(const s of strokes) for(let i=1;i<s.pts.length;i++){
      const a=s.pts[i-1],b=s.pts[i]; o.lineWidth=1.6+(b.p||0.5)*3.2;
      o.beginPath(); const mx=(a.x+b.x)/2,my=(a.y+b.y)/2; o.moveTo(a.x,a.y); o.quadraticCurveTo(a.x,a.y,mx,my); o.lineTo(b.x,b.y); o.stroke();
    }
    return off.toDataURL('image/jpeg',0.9).split(',')[1];
  }

  async function absorbAndAsk(){
    if(busy||!strokes.length) return;
    busy=true; clearTimeout(idleTimer);
    const b64=captureBase64();
    const pending=askWithRetry(b64); pending.catch(()=>{}); // fire during the fade
    await fadeCanvas(); strokes=[]; ctx.clearRect(0,0,W,H); canvas.style.opacity='1';
    let answer='';
    try{ answer=await pending; }
    catch(err){ toast("The ink runs dry — "+(err&&err.msg?err.msg:"try again")); busy=false; return; }
    await writeReply(answer||"…");
    await sleep(Math.min(9000,3200+answer.length*45));
    reply.style.opacity='0'; await sleep(1300); reply.textContent='';
    busy=false;
  }

  function fadeCanvas(){ return new Promise(res=>{ let op=1; canvas.style.transition='none'; const step=()=>{ op-=0.06; canvas.style.opacity=String(Math.max(0,op)); if(op>0)requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); }); }

  function writeReply(text){
    return new Promise(res=>{
      reply.textContent=''; reply.style.opacity='1';
      let i=0;
      const tick=()=>{
        if(i<=text.length){ reply.textContent=text.slice(0,i); i++;
          const c=text[i-1]||'';
          // organic hand-writing rhythm: pause at spaces/punctuation, jitter each stroke
          let d = c===' '?28 : /[.,!?;:]/.test(c)?170 : 30;
          d += Math.random()*30;
          setTimeout(()=>requestAnimationFrame(tick),d);
        } else { res(); }
      };
      tick();
    });
  }

  async function askDiary(b64){
    const res=await fetch(WORKER_URL,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:b64, prompt:SYSTEM, maxTokens:MAX_TOKENS})
    });
    if(!res.ok){ throw {status:res.status,msg:trimErr(await res.text())}; }
    const j=await res.json();
    if(j.error) throw {msg:trimErr(typeof j.error==='string'?j.error:JSON.stringify(j.error))};
    return clean(j.reply||'');
  }

  async function askWithRetry(b64){
    const delays=[0,1800];
    let lastErr;
    for(let i=0;i<delays.length;i++){
      if(delays[i]) await sleep(delays[i]);
      try{ return await askDiary(b64); }
      catch(e){
        lastErr=e;
        const sig=((e&&e.msg)||'')+' '+((e&&e.status)||'');
        if(!/50[023]|429|overload|unavailable|timeout|network|fetch|try again/i.test(sig)) throw e;
      }
    }
    throw lastErr;
  }

  function clean(s){ return (s||'').trim().replace(/^["']|["']$/g,''); }
  function trimErr(t){ try{ const j=JSON.parse(t); return ((j.error&&(j.error.message||j.error))||t).toString().slice(0,90);}catch(_){ return (t||'').slice(0,90);} }

  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  let toastT=null;
  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),3400); }

  document.getElementById('clear').addEventListener('click',()=>{ if(busy) return; strokes=[]; cur=null; ctx.clearRect(0,0,W,H); });
  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});

  resize();
})();
</script>
</body>
</html>
