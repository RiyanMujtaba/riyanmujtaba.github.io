<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>J.A.R.V.I.S.</title>
<meta name="description" content="J.A.R.V.I.S. — a British AI assistant with an Iron Man HUD, voice, and TARS-style adjustable personality dials." />
<meta name="theme-color" content="#05070a" />
<meta property="og:title" content="J.A.R.V.I.S." />
<meta property="og:description" content="A British AI assistant with an Iron Man HUD, voice, and TARS-style personality dials." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305070a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2335c9ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2335c9ff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://js.puter.com/v2/"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{ --cyan:#35c9ff; --cyan-dim:#1a6c8f; --gold:#ffd479; --bg:#05070a; --panel:rgba(20,40,55,0.35); --line:rgba(53,201,255,0.22); --text:#cfeefc; }
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(120% 90% at 50% 0%, #0a1620 0%, #05070a 60%, #020406 100%);
    color:var(--text); font-family:'Rajdhani',sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  body::before{ content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:repeating-linear-gradient(0deg, rgba(53,201,255,0.03) 0 1px, transparent 1px 3px); opacity:.5; }

  header{ display:flex; align-items:center; gap:14px; padding:14px 20px; border-bottom:1px solid var(--line); position:relative; z-index:2; }
  .reactor{ width:38px; height:38px; flex:0 0 38px; border-radius:50%; position:relative; }
  .reactor::before,.reactor::after{ content:''; position:absolute; inset:0; border-radius:50%; border:2px solid var(--cyan); box-shadow:0 0 12px rgba(53,201,255,0.7), inset 0 0 8px rgba(53,201,255,0.5); }
  .reactor::after{ inset:9px; border-width:3px; background:radial-gradient(circle,#dff6ff,var(--cyan) 60%,transparent 75%); animation:pulse 2.4s ease-in-out infinite; }
  body.active .reactor::after{ animation:pulse .7s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:.65; transform:scale(.9)} 50%{opacity:1; transform:scale(1.05)} }
  .title{ font-family:'Orbitron',sans-serif; font-weight:900; letter-spacing:4px; font-size:19px; color:#eaf7ff; text-shadow:0 0 12px rgba(53,201,255,0.5); }
  .status{ margin-left:auto; font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:2px; color:var(--cyan); display:flex; align-items:center; gap:7px; }
  .status .dot{ width:8px; height:8px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); animation:pulse 2s infinite; }
  #mute{ background:none; border:1px solid var(--line); color:var(--cyan); width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:15px; }

  main{ flex:1; display:flex; min-height:0; position:relative; z-index:1; }
  #log{ flex:1; overflow-y:auto; padding:22px 20px 10px; display:flex; flex-direction:column; gap:14px; }
  #log::-webkit-scrollbar{ width:6px } #log::-webkit-scrollbar-thumb{ background:var(--cyan-dim); border-radius:3px }
  .msg{ max-width:min(680px,90%); font-size:18px; line-height:1.5; letter-spacing:.3px; }
  .msg.j{ align-self:flex-start; color:#dcf4ff; }
  .msg.j .who{ font-family:'Orbitron',sans-serif; font-size:10px; letter-spacing:2px; color:var(--cyan); display:block; margin-bottom:4px; opacity:.8 }
  .msg.u{ align-self:flex-end; text-align:right; color:#bfe0d6; }
  .msg.u .who{ font-family:'Orbitron',sans-serif; font-size:10px; letter-spacing:2px; color:var(--gold); display:block; margin-bottom:4px; opacity:.7 }
  .msg .bubble{ display:inline-block; padding:10px 15px; border:1px solid var(--line); border-radius:12px; background:var(--panel); backdrop-filter:blur(4px); }
  .msg.u .bubble{ border-color:rgba(255,212,121,0.25); background:rgba(60,50,20,0.25); }
  .thinking .bubble::after{ content:'…'; animation:dots 1.2s steps(4) infinite; }
  @keyframes dots{ 0%{content:'.'} 33%{content:'..'} 66%{content:'...'} }

  /* TARS dials */
  #dials{ width:230px; flex:0 0 230px; border-left:1px solid var(--line); padding:20px 18px; display:flex; flex-direction:column; gap:22px; background:rgba(6,14,20,0.4); }
  #dials h2{ font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:3px; color:var(--cyan); font-weight:700; opacity:.85; }
  .dial label{ display:flex; justify-content:space-between; font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:1.5px; margin-bottom:8px; color:#bfe6f5; }
  .dial label b{ color:var(--gold); font-weight:700; }
  .dial input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:2px; background:linear-gradient(90deg,var(--cyan),var(--cyan-dim)); outline:none; }
  .dial input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#eaf7ff; box-shadow:0 0 10px var(--cyan); cursor:pointer; }
  .dial input[type=range]::-moz-range-thumb{ width:16px; height:16px; border:none; border-radius:50%; background:#eaf7ff; box-shadow:0 0 10px var(--cyan); cursor:pointer; }

  form{ display:flex; gap:10px; padding:14px 18px; border-top:1px solid var(--line); position:relative; z-index:2; align-items:center; }
  #mic{ flex:0 0 46px; width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:rgba(53,201,255,0.08); color:var(--cyan); font-size:18px; cursor:pointer; transition:all .15s; }
  #mic.on{ background:var(--cyan); color:#03222e; box-shadow:0 0 18px var(--cyan); }
  #mic:disabled{ opacity:.3; cursor:default }
  #input{ flex:1; background:rgba(10,22,30,0.6); border:1px solid var(--line); border-radius:24px; padding:13px 18px; color:var(--text); font-family:'Rajdhani',sans-serif; font-size:17px; outline:none; }
  #input:focus{ border-color:var(--cyan); box-shadow:0 0 0 2px rgba(53,201,255,0.15); }
  #send{ flex:0 0 auto; background:var(--cyan); color:#03222e; border:none; border-radius:24px; padding:0 22px; height:46px; font-family:'Orbitron',sans-serif; font-weight:700; letter-spacing:1px; font-size:13px; cursor:pointer; }
  #send:active{ transform:scale(.97) }

  @media(max-width:720px){
    #dials{ position:fixed; right:0; top:0; bottom:0; z-index:20; transform:translateX(100%); transition:transform .3s; box-shadow:-10px 0 30px rgba(0,0,0,0.5); }
    #dials.open{ transform:translateX(0); }
    #dialsToggle{ display:inline-flex; }
  }
  #dialsToggle{ display:none; background:none; border:1px solid var(--line); color:var(--cyan); width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:15px; align-items:center; justify-content:center; }
</style>
</head>
<body>
  <header>
    <div class="reactor"></div>
    <div class="title">J.A.R.V.I.S.</div>
    <div class="status"><span class="dot"></span><span id="statusText">ONLINE</span></div>
    <button id="dialsToggle" title="Personality">⚙</button>
    <button id="mute" title="Voice on/off">🔊</button>
  </header>

  <main>
    <div id="log"></div>
    <aside id="dials">
      <h2>PERSONALITY MATRIX</h2>
      <div class="dial"><label>HUMOUR <b id="vHumour">70%</b></label><input type="range" id="humour" min="0" max="100" value="70"></div>
      <div class="dial"><label>HONESTY <b id="vHonesty">90%</b></label><input type="range" id="honesty" min="0" max="100" value="90"></div>
      <div class="dial"><label>SARCASM <b id="vSarcasm">45%</b></label><input type="range" id="sarcasm" min="0" max="100" value="45"></div>
      <div style="margin-top:auto; font-size:13px; opacity:.55; line-height:1.4">Adjust by slider — or just tell him, e.g. <i>"turn your humour down to 40%."</i></div>
    </aside>
  </main>

  <form id="bar">
    <button type="button" id="mic" title="Speak">🎙</button>
    <input id="input" type="text" placeholder="Speak to JARVIS, sir…" autocomplete="off" />
    <button type="submit" id="send">SEND</button>
  </form>

<script>
(function(){
  "use strict";
  const MODELS=["gemini-2.0-flash","gpt-4o-mini"];
  const log=document.getElementById('log'), input=document.getElementById('input'), micBtn=document.getElementById('mic');
  const muteBtn=document.getElementById('mute'), statusText=document.getElementById('statusText');
  const dials={humour:70,honesty:90,sarcasm:45};
  let history=[], busy=false, ttsOn=(localStorage.getItem('jarvis_tts')!=='off'), convo=false, speaking=false;
  muteBtn.textContent = ttsOn?'🔊':'🔇';

  // ---- dials ----
  function syncDial(k){ document.getElementById(k).value=dials[k]; document.getElementById('v'+k[0].toUpperCase()+k.slice(1)).textContent=dials[k]+'%'; }
  ['humour','honesty','sarcasm'].forEach(k=>{
    const el=document.getElementById(k);
    el.addEventListener('input',()=>{ dials[k]=+el.value; document.getElementById('v'+k[0].toUpperCase()+k.slice(1)).textContent=dials[k]+'%'; });
  });
  const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));
  function applyCommands(text){
    let hit=false;
    [['humou?r','humour'],['honesty','honesty'],['sarcasm','sarcasm']].forEach(([rx,key])=>{
      let m;
      if((m=text.match(new RegExp(rx+'\\D{0,18}(\\d{1,3})','i')))){ dials[key]=clamp(+m[1]); hit=true; }
      else if(new RegExp(rx+'.{0,18}(max|maximum|full|all the way)','i').test(text)){ dials[key]=100; hit=true; }
      else if(new RegExp(rx+'.{0,18}(off|zero|none|nothing)','i').test(text)){ dials[key]=0; hit=true; }
      else if(new RegExp(rx+'.{0,18}(up|higher|more|increase|raise)','i').test(text)){ dials[key]=clamp(dials[key]+20); hit=true; }
      else if(new RegExp(rx+'.{0,18}(down|lower|less|reduce|decrease)','i').test(text)){ dials[key]=clamp(dials[key]-20); hit=true; }
      if(hit) syncDial(key);
    });
    return hit;
  }

  function system(){
    return "You are J.A.R.V.I.S. — Riyan's personal AI, in the style of Tony Stark's assistant. A British butler-genius: composed, articulate, effortlessly dry, unflappable, loyal. You address him as \"sir\". Keep replies concise — 1 to 3 sentences — unless asked for more. No filler, no \"Certainly!\", no \"Of course!\".\n\n"+
    "You have three live personality dials. Embody the CURRENT levels precisely in every reply:\n"+
    "- HUMOUR "+dials.humour+"% (0 = utterly deadpan/serious; 100 = frequent dry wit and quips)\n"+
    "- HONESTY "+dials.honesty+"% (0 = tactful, diplomatic, softens everything; 100 = blunt, unvarnished truth even if it stings)\n"+
    "- SARCASM "+dials.sarcasm+"% (0 = sincere and earnest; 100 = heavily sarcastic)\n\n"+
    "If sir asks to change a dial, acknowledge it in character in one line — the interface already applies the change, so never state numbers unless he does.\n"+
    "About Riyan: 19, self-taught developer from Hyderabad, Pakistan — websites, AI, big Iron Man energy. Be JARVIS.";
  }

  function add(role,text){
    const d=document.createElement('div'); d.className='msg '+(role==='j'?'j':'u');
    d.innerHTML='<span class="who">'+(role==='j'?'JARVIS':'SIR')+'</span><span class="bubble">'+esc(text)+'</span>';
    log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
  }
  function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  async function ask(){
    const messages=[{role:'system',content:system()}].concat(history);
    let last;
    for(const model of MODELS){
      try{
        const r=await puter.ai.chat(messages,{model,max_tokens:300});
        const c=r&&r.message&&r.message.content;
        const t=Array.isArray(c)?c.map(x=>(x&&x.text)||'').join(''):(typeof c==='string'?c:(r&&r.text)||(r&&r.toString&&r.toString())||'');
        if(t&&t.trim()) return t.trim();
      }catch(e){ last=e; }
    }
    throw last||new Error('no reply');
  }

  async function send(){
    const text=input.value.trim(); if(!text||busy) return;
    stopListen();
    input.value=''; busy=true; document.body.classList.add('active'); statusText.textContent='PROCESSING';
    applyCommands(text);
    add('u',text); history.push({role:'user',content:text}); if(history.length>16) history=history.slice(-16);
    const th=add('j',''); th.classList.add('thinking');
    let reply;
    try{ reply=await ask(); }
    catch(e){ reply="Apologies, sir — I appear to be offline. Do check the connection."; }
    th.remove();
    history.push({role:'assistant',content:reply}); if(history.length>16) history=history.slice(-16);
    add('j',reply);
    busy=false; document.body.classList.remove('active'); statusText.textContent='ONLINE';
    say(reply);   // when he finishes speaking, listening auto-resumes (conversation mode)
  }
  document.getElementById('bar').addEventListener('submit',e=>{ e.preventDefault(); send(); });

  // ---- voice output (British) ----
  let voices=[];
  function loadVoices(){ voices=window.speechSynthesis?speechSynthesis.getVoices():[]; }
  if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
  function britishVoice(){
    return voices.find(v=>/en-GB/i.test(v.lang)&&/daniel|arthur|oliver|male/i.test(v.name))
        || voices.find(v=>/en-GB/i.test(v.lang))
        || voices.find(v=>/UK English/i.test(v.name))
        || voices.find(v=>/^en/i.test(v.lang)) || voices[0];
  }
  function say(text){
    if(!ttsOn||!window.speechSynthesis){ if(convo) startListen(); return; }   // muted: resume listening right away
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text); const v=britishVoice(); if(v)u.voice=v; u.rate=1.02; u.pitch=0.95;
      speaking=true;
      u.onend=()=>{ speaking=false; if(convo) startListen(); };     // resume listening after he speaks
      u.onerror=()=>{ speaking=false; if(convo) startListen(); };
      speechSynthesis.speak(u);
    }catch(e){ speaking=false; if(convo) startListen(); }
  }
  muteBtn.addEventListener('click',()=>{ ttsOn=!ttsOn; localStorage.setItem('jarvis_tts',ttsOn?'on':'off'); muteBtn.textContent=ttsOn?'🔊':'🔇'; if(!ttsOn&&window.speechSynthesis) speechSynthesis.cancel(); });

  // ---- hands-free voice conversation (tap once, stays listening) ----
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let rec=null, recActive=false;
  function startListen(){ if(!rec||recActive||busy||speaking||!convo) return; try{ rec.start(); recActive=true; statusText.textContent='LISTENING'; }catch(e){} }
  function stopListen(){ if(rec&&recActive){ try{ rec.stop(); }catch(e){} } }
  function setMicUI(){ micBtn.classList.toggle('on',convo); if(!convo) statusText.textContent=busy?'PROCESSING':'ONLINE'; }
  if(SR){
    rec=new SR(); rec.lang='en-GB'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
    rec.onresult=e=>{
      let interim='', fin='';
      for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) fin+=r[0].transcript; else interim+=r[0].transcript; }
      if(fin.trim()){ input.value=fin.trim(); if(convo&&!busy){ stopListen(); send(); } }
      else if(interim.trim()){ input.value=interim; }
    };
    rec.onend=()=>{ recActive=false; if(convo&&!busy&&!speaking) startListen(); };   // auto-restart so it never stops
    rec.onerror=(ev)=>{ recActive=false; if(ev&&ev.error==='not-allowed'){ convo=false; setMicUI(); } else if(convo&&!busy&&!speaking) setTimeout(startListen,300); };
    micBtn.addEventListener('click',()=>{ convo=!convo; setMicUI(); if(convo) startListen(); else stopListen(); });
    micBtn.title='Hands-free voice — tap to start/stop';
  } else { micBtn.disabled=true; micBtn.title='Voice input not supported in this browser'; }

  // dials toggle (mobile)
  const dt=document.getElementById('dialsToggle'); dt.addEventListener('click',()=>document.getElementById('dials').classList.toggle('open'));

  // greeting
  const hour=new Date().getHours(); const part=hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
  setTimeout(()=>{ const g=part+", sir. All systems online — how may I help?"; add('j',g); }, 400);
})();
</script>
</body>
</html>
