<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Selected Work — Riyan Mujtaba</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0c0c0e" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0b0c10;--card:#14161c;--line:rgba(255,255,255,0.1);--text:#eef1f6;--muted:#8b93a7;--accent:#e5be6a}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
  .sg{font-family:'Space Grotesk',sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:0 26px}
  a{color:inherit;text-decoration:none}
  header{padding:80px 0 40px;text-align:center}
  .eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
  h1{font-family:'Space Grotesk';font-weight:700;font-size:clamp(34px,6vw,56px);letter-spacing:-1px;line-height:1.05;margin-bottom:14px}
  header p{color:var(--muted);max-width:520px;margin:0 auto;font-size:16px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px 0 70px}
  .card{display:block;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);transition:transform .25s,border-color .25s,box-shadow .25s}
  .card:hover{transform:translateY(-5px);border-color:rgba(229,190,106,0.5);box-shadow:0 18px 40px rgba(0,0,0,0.4)}
  .thumb{aspect-ratio:16/10;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
  .thumb iframe{position:absolute;top:0;left:0;width:200%;height:200%;transform:scale(0.5);transform-origin:top left;border:0;pointer-events:none;background:#0b0c10}
  .body{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .body .n{font-family:'Space Grotesk';font-weight:600;font-size:17px}
  .body .t{font-size:12px;color:var(--muted)}
  .body .arr{color:var(--accent);transition:transform .2s}
  .card:hover .arr{transform:translate(3px,-3px)}
  footer{text-align:center;padding:30px 0 50px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
  footer a{color:var(--accent)}
  @media(max-width:820px){.grid{grid-template-columns:1fr 1fr}}
  @media(max-width:540px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
  <header>
    <div class="eyebrow">Selected Work</div>
    <h1 class="sg">Websites, built to convert.</h1>
    <p>A selection of restaurant, café and sports-venue sites I've designed &amp; built — each one bespoke to the brand.</p>
  </header>

  <div class="wrap">
    <div class="grid" id="grid"></div>
  </div>

  <footer>
    Designed &amp; built by <a href="https://riyanmujtaba.github.io" target="_blank" rel="noopener">Riyan Mujtaba</a>
  </footer>

  <script>
    var SITES = [
      {slug:'trio-burger',      name:'TRIO Burger',       type:'Smash burgers · Hyderabad'},
      {slug:'kove',             name:'Kóve',              type:'Café & kitchen · Karachi'},
      {slug:'la-moosh',         name:'La Moosh',          type:'Restaurant & rooftop · Hyderabad'},
      {slug:'kabab-ghar',       name:'Kabab Ghar',        type:'Garden grill · Hyderabad'},
      {slug:'hyderabad-darbar', name:'Hyderabad Darbar',  type:'Desi dining · Hyderabad'},
      {slug:'jden',             name:"J'DEN Smash",       type:'Smash burgers · Karachi & Hyd'},
      {slug:'space-padel',      name:'Space Padel',       type:'Padel club · Hyderabad'},
      {slug:'padel-core',       name:'Padel Core',        type:'Padel courts · Hyderabad'},
      {slug:'sky-arena',        name:'Sky Arena',         type:'Sports hub · Hyderabad'}
    ];
    document.getElementById('grid').innerHTML = SITES.map(function(s){
      return '<a class="card" href="'+s.slug+'/" target="_blank" rel="noopener">'
        + '<div class="thumb"><iframe src="'+s.slug+'/" loading="lazy" scrolling="no" title="'+s.name+'"></iframe></div>'
        + '<div class="body"><div><div class="n">'+s.name+'</div><div class="t">'+s.type+'</div></div>'
        + '<div class="arr">↗</div></div></a>';
    }).join('');
  </script>
</body>
</html>
